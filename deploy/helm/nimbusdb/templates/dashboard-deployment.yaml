apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusdb.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image }}
          ports:
            - containerPort: {{ .Values.dashboard.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusdb.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: dashboard
