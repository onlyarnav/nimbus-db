apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusdb.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:

            - containerPort: {{ .Values.gateway.httpPort }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.gateway.httpPort | quote }}
            - name: METADATA_SERVICE_ADDR
              value: "{{ include "nimbusdb.fullname" . }}-metadata-service:{{ .Values.metadataService.grpcPort }}"
            - name: METADATA_GRPC_ADDR
              value: "{{ include "nimbusdb.fullname" . }}-metadata-service:{{ .Values.metadataService.grpcPort }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nimbusdb.fullname" . }}-secrets
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusdb.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.httpPort }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: gateway
