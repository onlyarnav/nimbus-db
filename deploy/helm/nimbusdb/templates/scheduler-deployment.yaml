apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusdb.fullname" . }}-scheduler
  labels:
    app.kubernetes.io/name: scheduler
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      containers:
        - name: scheduler
          image: {{ .Values.scheduler.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:

            - containerPort: {{ .Values.scheduler.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.scheduler.metricsPort }}
              name: metrics
          env:
            - name: SCHEDULER_PORT
              value: {{ .Values.scheduler.grpcPort | quote }}
            - name: METADATA_GRPC_ADDR
              value: "{{ include "nimbusdb.fullname" . }}-metadata-service:{{ .Values.metadataService.grpcPort }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nimbusdb.fullname" . }}-secrets
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusdb.fullname" . }}-scheduler
  labels:
    app.kubernetes.io/name: scheduler
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.scheduler.grpcPort }}
      targetPort: grpc
      name: grpc
    - port: {{ .Values.scheduler.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: scheduler
