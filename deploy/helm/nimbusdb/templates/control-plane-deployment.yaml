apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusdb.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/name: control-plane
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: {{ .Values.controlPlane.image }}
          ports:
            - containerPort: {{ .Values.controlPlane.httpPort }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.controlPlane.httpPort | quote }}
            - name: METADATA_GRPC_ADDR
              value: "{{ include "nimbusdb.fullname" . }}-metadata-service:{{ .Values.metadataService.grpcPort }}"
            - name: SCHEDULER_GRPC_ADDR
              value: "{{ include "nimbusdb.fullname" . }}-scheduler:{{ .Values.scheduler.grpcPort }}"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusdb.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/name: control-plane
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.controlPlane.httpPort }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: control-plane
