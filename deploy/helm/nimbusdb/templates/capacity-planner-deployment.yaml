apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusdb.fullname" . }}-capacity-planner
  labels:
    app.kubernetes.io/name: capacity-planner
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.capacityPlanner.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-planner
    spec:
      containers:
        - name: capacity-planner
          image: {{ .Values.capacityPlanner.image }}
          ports:
            - containerPort: {{ .Values.capacityPlanner.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.capacityPlanner.metricsPort }}
              name: metrics
          env:
            - name: GRPC_PORT
              value: {{ .Values.capacityPlanner.grpcPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.capacityPlanner.metricsPort | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.capacityPlanner.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusdb.fullname" . }}-capacity-planner
  labels:
    app.kubernetes.io/name: capacity-planner
    {{- include "nimbusdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.capacityPlanner.grpcPort }}
      targetPort: grpc
      name: grpc
    - port: {{ .Values.capacityPlanner.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: capacity-planner
