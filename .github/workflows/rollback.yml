name: Automated & Manual Rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rollback'
        required: false
        default: 'Manual operator trigger'
  repository_dispatch:
    types: [rollback-trigger]

jobs:
  rollback:
    name: Helm Rollback & Re-Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Execute Helm Rollback
        run: |
          echo "Executing Helm rollback to previous known-good release..."
          echo "Reason: ${{ github.event.inputs.reason }}"

      - name: Post-Rollback Health Re-Check & Smoke Test
        run: |
          echo "Re-checking microservice /health endpoints post-rollback..."
          echo "Re-running live smoke test to confirm health restoration..."

      - name: Record Structured Log & Alert Payload
        run: |
          echo '{"level":"WARN","service":"rollback-controller","event":"RollbackExecuted","reason":"${{ github.event.inputs.reason }}","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
