syntax = "proto3";

package nodeagent;

option go_package = "github.com/onlyarnav/nimbusdb/services/worker-node/proto;nodeagent";

service NodeAgent {
  // CreateDatabase allocates directory space and registers a database.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);

  // DeleteDatabase deletes database allocations.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);

  // BackupDatabase is stubbed in this phase.
  rpc BackupDatabase(BackupDatabaseRequest) returns (BackupDatabaseResponse);

  // RestoreDatabase restores database from snapshot.
  rpc RestoreDatabase(RestoreDatabaseRequest) returns (RestoreDatabaseResponse);

  // InsertVector stores vector embedding with metadata into storage engine.
  rpc InsertVector(InsertVectorRequest) returns (InsertVectorResponse);

  // SearchVector performs exact or HNSW ANN vector similarity search with metadata filtering.
  rpc SearchVector(SearchVectorRequest) returns (SearchVectorResponse);

  // DrainNode prepares a node for safe shutdown by migrating all hosted databases off the node.
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
}

message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {
  bool success = 1;
  int32 databases_moved = 2;
  string error = 3;
}

message CreateDatabaseRequest {
  string name = 1;
  string database_id = 2;
}

message CreateDatabaseResponse {
  bool success = 1;
  string endpoint = 2;
  string error = 3;
}

message DeleteDatabaseRequest {
  string database_id = 1;
}

message DeleteDatabaseResponse {
  bool success = 1;
  string error = 2;
}

message BackupDatabaseRequest {
  string database_id = 1;
}

message BackupDatabaseResponse {
  bool success = 1;
  string backup_path = 2;
  string error = 3;
}

message RestoreDatabaseRequest {
  string database_id = 1;
  string backup_path = 2;
}

message RestoreDatabaseResponse {
  bool success = 1;
  string error = 2;
}

message InsertVectorRequest {
  string database_id = 1;
  string id = 2;
  bytes data = 3;
  repeated float embedding = 4;
  map<string, string> metadata = 5;
}

message InsertVectorResponse {
  bool success = 1;
  uint64 lsn = 2;
  string error = 3;
}

message SearchVectorRequest {
  string database_id = 1;
  repeated float query_embedding = 2;
  int32 top_k = 3;
  string filter_expression = 4;
  bool exact = 5;
}

message VectorSearchResult {
  string id = 1;
  float similarity = 2;
}

message SearchVectorResponse {
  bool success = 1;
  repeated VectorSearchResult results = 2;
  string error = 3;
}

